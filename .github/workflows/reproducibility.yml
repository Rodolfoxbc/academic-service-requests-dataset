name: Reproducibility check

on:
  push:
    branches:
      - reviewer2-reproducibility-fixes
      - main
  pull_request:
    branches:
      - main

jobs:
  reproduce:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run complete analysis
        run: python run_analysis.py

      - name: Verify key outputs
        run: |
          test -f outputs/tables/validation_summary.csv
          test -f outputs/tables/standardized_undesirable_rates.csv
          test -f outputs/tables/illustrative_chi_square_cramers_v.csv
          test -f outputs/figures/figure_03a_dominant_request_types.png
          test -f outputs/figures/figure_03b_remaining_request_types.png
          test -f outputs/figures/figure_06_undesirable_rate_heatmap.png
